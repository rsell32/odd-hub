
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">
<title>ODD//SNAKE — Odd Hub</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:#fff;
  font-family:Arial,sans-serif;
  background:radial-gradient(ellipse at top,#201044 0%,#090d18 55%);
  display:flex;justify-content:center;align-items:center;padding:20px
}
.game{width:min(100%,650px);text-align:center}
.logo{font-size:14px;letter-spacing:5px;color:#b9a1ff}
h1{font-size:clamp(38px,9vw,64px);margin:8px 0;color:#fff;
text-shadow:0 0 22px #a044ff}
.subtitle{color:#a9abc4;margin:0 0 22px}
.stats{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
.stat{flex:1;padding:12px;background:#15172a;border:1px solid #34305a;border-radius:12px}
.stat small{display:block;color:#aaa8c9;font-size:11px;letter-spacing:2px}
.stat strong{font-size:23px;color:#55eaff}
.board-wrap{position:relative;padding:8px;border-radius:18px;
background:linear-gradient(135deg,#a044ff,#28dfff)}
canvas{display:block;width:100%;background:#090d18;border-radius:12px;
touch-action:none}
.overlay{position:absolute;inset:8px;background:#080b18dd;border-radius:12px;
display:flex;flex-direction:column;justify-content:center;align-items:center;
padding:20px}
.overlay h2{font-size:30px;margin:0 0 10px;color:#fff}
.overlay p{color:#c1c2d8;max-width:300px;line-height:1.5}
button{border:0;border-radius:10px;padding:13px 22px;font-weight:bold;
cursor:pointer;color:#080d18;background:linear-gradient(100deg,#d34cff,#28dfff)}
button:hover{filter:brightness(1.12)}
.controls{display:flex;justify-content:center;gap:10px;margin-top:15px;flex-wrap:wrap}
.controls button{background:#191b32;color:#fff;border:1px solid #49416e}
.hint{font-size:12px;color:#9698b5;margin-top:15px}
.pad{display:grid;grid-template-columns:repeat(3,48px);gap:5px;
justify-content:center;margin:18px auto 0}
.pad button{padding:12px 0;font-size:18px}
.pad .empty{visibility:hidden}
</style>
</head>
<body>
<main class="game">
  <div class="logo">ODD HUB ORIGINAL</div>
  <h1>ODD//SNAKE</h1>
  <p class="subtitle">Eat. Grow. Survive.</p>

  <div class="stats">
    <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
    <div class="stat"><small>BEST</small><strong id="best">0</strong></div>
    <div class="stat"><small>LEVEL</small><strong id="level">1</strong></div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="message">READY?</h2>
      <p id="description">Collect the glowing energy orbs. Grow your snake and beat your best score.</p>
      <button id="start">START GAME</button>
    </div>
  </div>

  <div class="controls">
    <button id="pause">PAUSE</button>
    <button id="restart">RESTART</button>
  </div>

  <div class="pad">
    <span class="empty"></span><button data-dir="up">▲</button><span class="empty"></span>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
  <p class="hint">Use ARROW KEYS or WASD · Swipe or use the buttons on mobile</p>
</main>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const size=24, cells=20;
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const levelEl=document.getElementById("level");
const overlay=document.getElementById("overlay");
const message=document.getElementById("message");
const description=document.getElementById("description");
const startBtn=document.getElementById("start");

let snake,food,direction,nextDirection,score,best,level;
let running=false,paused=false,gameOver=false,timer=null;
let touchStart=null;

best=Number(localStorage.getItem("oddSnakeBest")||0);
bestEl.textContent=best;

function reset(){
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  direction={x:1,y:0};
  nextDirection={x:1,y:0};
  score=0;level=1;
  scoreEl.textContent=score;
  levelEl.textContent=level;
  placeFood();draw();
}

function placeFood(){
  do{
    food={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)};
  }while(snake.some(part=>part.x===food.x&&part.y===food.y));
}


function draw(){
  ctx.clearRect(0,0,480,480);

  // Dark futuristic arena
  ctx.fillStyle="#090d18";
  ctx.fillRect(0,0,480,480);

  // Subtle arena grid
  ctx.strokeStyle="#171b30";
  ctx.lineWidth=1;

  for(let i=0;i<=cells;i++){
    ctx.beginPath();
    ctx.moveTo(i*size,0);
    ctx.lineTo(i*size,480);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,i*size);
    ctx.lineTo(480,i*size);
    ctx.stroke();
  }

  // Glowing energy orb
  const fx=food.x*size+12;
  const fy=food.y*size+12;

  ctx.save();
  ctx.shadowBlur=25;
  ctx.shadowColor="#d34cff";

  const orb=ctx.createRadialGradient(fx-3,fy-3,1,fx,fy,12);
  orb.addColorStop(0,"#ffffff");
  orb.addColorStop(0.3,"#d34cff");
  orb.addColorStop(1,"#791bff");

  ctx.fillStyle=orb;
  ctx.beginPath();
  ctx.arc(fx,fy,9,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Smooth connected snake body
  if(snake.length>1){
    ctx.save();
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.lineWidth=18;
    ctx.shadowBlur=17;
    ctx.shadowColor="#25dfff";

    const bodyGradient=ctx.createLinearGradient(0,0,480,480);
    bodyGradient.addColorStop(0,"#d34cff");
    bodyGradient.addColorStop(0.5,"#6d6bff");
    bodyGradient.addColorStop(1,"#18eaff");

    ctx.strokeStyle=bodyGradient;
    ctx.beginPath();

    ctx.moveTo(
      snake[0].x*size+12,
      snake[0].y*size+12
    );

    for(let i=1;i<snake.length;i++){
      ctx.lineTo(
        snake[i].x*size+12,
        snake[i].y*size+12
      );
    }

    ctx.stroke();
    ctx.restore();
  }

  // Snake head
  const hx=snake[0].x*size+12;
  const hy=snake[0].y*size+12;

  ctx.save();
  ctx.shadowBlur=23;
  ctx.shadowColor="#d34cff";

  const headGradient=ctx.createRadialGradient(
    hx-4,hy-5,2,hx,hy,15
  );

  headGradient.addColorStop(0,"#ffffff");
  headGradient.addColorStop(0.25,"#e18cff");
  headGradient.addColorStop(1,"#a02cff");

  ctx.fillStyle=headGradient;
  ctx.beginPath();
  ctx.arc(hx,hy,11,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Head direction and eyes
  const dx=direction.x;
  const dy=direction.y;
  const px=-dy;
  const py=dx;

  for(let side of [-1,1]){
    const ex=hx+dx*5+px*side*5;
    const ey=hy+dy*5+py*side*5;

    ctx.fillStyle="#ffffff";
    ctx.beginPath();
    ctx.arc(ex,ey,3.5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#101020";
    ctx.beginPath();
    ctx.arc(ex+dx*1.2,ey+dy*1.2,1.8,0,Math.PI*2);
    ctx.fill();
  }

  // Small glowing snout
  ctx.fillStyle="#28eaff";
  ctx.shadowBlur=10;
  ctx.shadowColor="#28eaff";
  ctx.beginPath();
  ctx.arc(hx+dx*9,hy+dy*9,2,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function tick(){
  if(!running||paused)return;
  direction=nextDirection;
  const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
  const ate=head.x===food.x&&head.y===food.y;
  const body=ate?snake:snake.slice(0,-1);

  if(head.x<0||head.x>=cells||head.y<0||head.y>=cells||
     body.some(part=>part.x===head.x&&part.y===head.y)){
    endGame();return;
  }

  snake.unshift(head);
  if(ate){
    score+=10;
    scoreEl.textContent=score;
    level=Math.floor(score/50)+1;
    levelEl.textContent=level;
    if(score>best){
      best=score;
      localStorage.setItem("oddSnakeBest",best);
      bestEl.textContent=best;
    }
    placeFood();
  }else snake.pop();

  draw();
  clearTimeout(timer);
  timer=setTimeout(tick,Math.max(65,145-(level-1)*10));
}

function startGame(){
  clearTimeout(timer);
  reset();
  running=true;paused=false;gameOver=false;
  overlay.style.display="none";
  tick();
}

function endGame(){
  running=false;gameOver=true;
  message.textContent="GAME OVER";
  description.textContent="You scored "+score+" points. Ready for another round?";
  startBtn.textContent="PLAY AGAIN";
  overlay.style.display="flex";
}

function setDirection(dir){
  const dirs={
    up:{x:0,y:-1},down:{x:0,y:1},
    left:{x:-1,y:0},right:{x:1,y:0}
  };
  const d=dirs[dir];
  if(d&&!(d.x===-direction.x&&d.y===-direction.y)){
    nextDirection=d;
  }
}

document.addEventListener("keydown",e=>{
  const keys={
    ArrowUp:"up",w:"up",W:"up",
    ArrowDown:"down",s:"down",S:"down",
    ArrowLeft:"left",a:"left",A:"left",
    ArrowRight:"right",d:"right",D:"right"
  };
  if(keys[e.key]){
    e.preventDefault();setDirection(keys[e.key]);
  }
  if(e.key===" "){
    e.preventDefault();togglePause();
  }
});

document.querySelectorAll("[data-dir]").forEach(btn=>{
  btn.addEventListener("click",()=>setDirection(btn.dataset.dir));
});

canvas.addEventListener("touchstart",e=>{
  touchStart={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
},{passive:true});

canvas.addEventListener("touchend",e=>{
  if(!touchStart)return;
  const dx=e.changedTouches[0].clientX-touchStart.x;
  const dy=e.changedTouches[0].clientY-touchStart.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>20){
    setDirection(Math.abs(dx)>Math.abs(dy)?
      (dx>0?"right":"left"):(dy>0?"down":"up"));
  }
  touchStart=null;
},{passive:true});

function togglePause(){
  if(!running)return;
  paused=!paused;
  document.getElementById("pause").textContent=paused?"RESUME":"PAUSE";
  if(paused){
    clearTimeout(timer);
    message.textContent="PAUSED";
    description.textContent="Take a break. Your score is "+score+".";
    startBtn.textContent="RESUME";
    overlay.style.display="flex";
  }else{
    overlay.style.display="none";
    tick();
  }
}

startBtn.addEventListener("click",()=>{
  if(paused)togglePause();
  else startGame();
});
document.getElementById("pause").addEventListener("click",togglePause);
document.getElementById("restart").addEventListener("click",startGame);

reset();
</script>
</body>
</html>
